[package]
name = "packet-proof"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["tray-icon"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sysinfo = "0.39.6"
genpdf = { version = "0.2.0", features = ["images"] }
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series", "ttf"] }
trippy-core = "0.13.0"
# Compiles out trippy-core's #[instrument] spans (and any other tracing use in
# the dependency graph) entirely, rather than just leaving them unused. We
# never install a tracing subscriber, and the span enter/exit machinery those
# instrumented raw-socket calls go through crashes intermittently on Windows
# release builds with 0xc0000005 inside tracing_core::dispatcher::Dispatch::exit,
# confirmed via minidump analysis. Cargo feature unification means this one
# extra feature on our own tracing dependency applies build-wide.
tracing = { version = "0.1.41", features = ["max_level_off"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
